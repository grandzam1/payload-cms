name: CI build then deploy (Linux)

# One Linux build gate, then trigger Netlify + Vercel (they build on their side).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          export PAYLOAD_SECRET="${PAYLOAD_SECRET:-ci-build-placeholder-secret-min-32-chars}"
          export DATABASE_URL="${DATABASE_URL:-postgresql://ci:ci@127.0.0.1:5432/ci}"
          export DATABASE_URL_UNPOOLED="${DATABASE_URL_UNPOOLED:-$DATABASE_URL}"
          pnpm build

  deploy-netlify:
    name: Deploy Netlify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger Netlify build + wait
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "Missing NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID"
            exit 1
          fi

          echo "Starting Netlify build for site $NETLIFY_SITE_ID (commit $GITHUB_SHA)"
          resp=$(curl -sS -X POST \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds" \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')
          build_id=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "$build_id" ] || [ "$build_id" = "null" ]; then
            echo "Failed to start Netlify build: $resp"
            exit 1
          fi
          echo "Netlify build id: $build_id"

          for i in $(seq 1 60); do
            build=$(curl -sS \
              "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds/${build_id}" \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}")
            state=$(echo "$build" | jq -r '.done // false')
            error=$(echo "$build" | jq -r '.error // empty')
            sha=$(echo "$build" | jq -r '.sha // empty')
            echo "try $i done=$state error=${error:-none} sha=$sha"
            if [ "$state" = "true" ]; then
              if [ -n "$error" ] && [ "$error" != "null" ]; then
                echo "Netlify build failed: $error"
                exit 1
              fi
              echo "Netlify build finished"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Netlify"
          exit 1

  deploy-vercel:
    name: Deploy Vercel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (remote build)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "Missing VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Missing VERCEL_ORG_ID or VERCEL_PROJECT_ID"
            exit 1
          fi
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          # Upload source; Vercel builds on their infrastructure (no local pnpm build).
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  smoke:
    name: Smoke prod hosts
    needs: [deploy-netlify, deploy-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host:
          - https://payload-cms-tan-nine.vercel.app
          - https://payload-cms-neon-test.netlify.app
    steps:
      - name: Probe admin + login
        env:
          BASE: ${{ matrix.host }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Host: $BASE"
          sleep 15
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$BASE/admin")
          echo "GET /admin -> $code"
          test "$code" = "200"
          api=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$BASE/api/users")
          echo "GET /api/users -> $api"
          test "$api" = "403" -o "$api" = "200"
          if [ -z "${ADMIN_EMAIL:-}" ] || [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "Missing ADMIN_EMAIL/ADMIN_PASSWORD"
            exit 1
          fi
          login=$(curl -sS -o /tmp/login.json -w "%{http_code}" --max-time 60 \
            -X POST "$BASE/api/users/login" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          echo "POST /api/users/login -> $login"
          test "$login" = "200"
