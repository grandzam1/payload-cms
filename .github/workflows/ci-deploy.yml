name: CI build then deploy (Linux)

# Every push to main: build first on GitHub Linux.
# Netlify + Vercel deploy only if that build succeeds.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          # Gate compile only — placeholders are fine if secrets are absent
          export PAYLOAD_SECRET="${PAYLOAD_SECRET:-ci-build-placeholder-secret-min-32-chars}"
          export DATABASE_URL="${DATABASE_URL:-postgresql://ci:ci@127.0.0.1:5432/ci}"
          export DATABASE_URL_UNPOOLED="${DATABASE_URL_UNPOOLED:-$DATABASE_URL}"
          pnpm build

  deploy-netlify:
    name: Deploy Netlify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Netlify (Linux build + publish)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "Missing NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID"
            exit 1
          fi
          npx netlify-cli deploy --build --prod --message "GHA ${GITHUB_SHA}"

  deploy-vercel:
    name: Deploy Vercel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      statuses: read
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: pnpm install --frozen-lockfile

      - name: Link Vercel project
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy to Vercel production (token)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Wait for Vercel Git deploy (no token)
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "VERCEL_TOKEN not set — waiting for Vercel GitHub integration on $GITHUB_SHA"
          echo "Tip: add repo secret VERCEL_TOKEN so GHA deploys Vercel only after the build gate."
          for i in $(seq 1 60); do
            checks=$(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[]? | select(.name|test("Vercel";"i")) | {name,status,conclusion}]' 2>/dev/null || echo '[]')
            statuses=$(gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/status" \
              --jq '[.statuses[]? | select(.context|test("Vercel";"i")) | {context,state}]' 2>/dev/null || echo '[]')
            echo "try $i checks=$checks statuses=$statuses"
            if echo "$checks" | grep -qi '"conclusion":"success"'; then
              echo "Vercel check succeeded"
              exit 0
            fi
            if echo "$statuses" | grep -qi '"state":"success"'; then
              echo "Vercel status succeeded"
              exit 0
            fi
            if echo "$checks" | grep -qiE '"conclusion":"(failure|cancelled|timed_out)"'; then
              echo "Vercel check failed"
              exit 1
            fi
            if echo "$statuses" | grep -qiE '"state":"(failure|error)"'; then
              echo "Vercel status failed"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Vercel"
          exit 1

  smoke:
    name: Smoke prod hosts
    needs: [deploy-netlify, deploy-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host:
          - https://payload-cms-tan-nine.vercel.app
          - https://payload-cms-neon-test.netlify.app
    steps:
      - name: Probe admin + login
        env:
          BASE: ${{ matrix.host }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Host: $BASE"
          # Give CDN a moment after deploy
          sleep 20
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$BASE/admin")
          echo "GET /admin -> $code"
          test "$code" = "200"
          api=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$BASE/api/users")
          echo "GET /api/users -> $api"
          test "$api" = "403" -o "$api" = "200"
          if [ -z "${ADMIN_EMAIL:-}" ] || [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "Missing ADMIN_EMAIL/ADMIN_PASSWORD"
            exit 1
          fi
          login=$(curl -sS -o /tmp/login.json -w "%{http_code}" --max-time 60 \
            -X POST "$BASE/api/users/login" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          echo "POST /api/users/login -> $login"
          test "$login" = "200"
