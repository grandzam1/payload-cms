name: Deploy Vercel + smoke (Linux)

# Superseded by ci-deploy.yml. Manual smoke only.
on:
  workflow_dispatch:

concurrency:
  group: vercel-smoke-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host:
          - https://payload-cms-tan-nine.vercel.app
          - https://payload-cms-neon-test.netlify.app
    steps:
      - name: Probe admin + login
        env:
          BASE: ${{ matrix.host }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$BASE/admin")
          echo "GET /admin -> $code"
          test "$code" = "200"
          login=$(curl -sS -o /tmp/login.json -w "%{http_code}" --max-time 60 \
            -X POST "$BASE/api/users/login" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          echo "POST /api/users/login -> $login"
          test "$login" = "200"
